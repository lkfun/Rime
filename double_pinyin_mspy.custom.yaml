patch:
  # 输入引擎
  # 输入引擎
  engine/translators:
      - punct_translator
      - script_translator
      - lua_translator@*date_translator    # 时间、日期、星期
      - lua_translator@*lunar              # 农历
      - lua_translator@*uuid               # UUID
      - table_translator@custom_phrase     # 自定义短语 custom_phrase_double.txt
      - table_translator@melt_eng          # 英文输入
      - table_translator@cn_en             # 中英混合词汇
      - table_translator@radical_lookup    # 部件拆字反查
      - lua_translator@*unicode            # Unicode
      - lua_translator@*number_translator  # 数字、金额大写
      - lua_translator@*calc_translator    # 计算器
      - lua_translator@*test
      - lua_translator@weather_translator
      - lua_translator@cloud_pinyin_translator
      - lua_translator@*force_gc           # 暴力 GC
  engine/processors:
    - lua_processor@*select_character  # 以词定字
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - lua_processor@cloud_pinyin_processor
    - express_editor
  # Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
  date_translator:
    date: rq            # 日期： 2022-11-29
    time: sj            # 时间： 18:13
    week: xq            # 星期： 星期二
    datetime: rqsj    # ISO 8601： 2022-11-29T18:13:11+08:00
    timestamp: sjc  # 时间戳： 1669716794
    datezh: datezh        # 中文日期： 二〇二六年二月二十五日 | 二零二六年二月二十五日
    dateen: dateen        # 英文日期： 英式 8 March 2026 | 美式 March 8, 2026
  lunar: nl

  weather: weather          # 输入 weather 输出默认城市
  weather_prefix: W         # 输入 W北京 输出北京天气
  weather_default_city: fuzhou
  weather_format: "%l：%C %t，体感%f，湿度%h，风%w"